
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expense Tracker</title>


    <!-- ============================= -->
    <!-- Bootstrap Icons -->
    <!-- ============================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- ============================= -->
    <!-- Bootstrap -->
    <!-- ============================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/wallet2.svg">


    <!-- ============================= -->
    <!-- My CSS -->
    <!-- ============================= -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ============================= -->
    <!-- Navbar -->
    <!-- ============================= -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand d-flex align-items-center gap-2"
                href="#"
            >

                <!-- Wallet Logo -->
                <i class="bi bi-wallet2 fs-3"></i>


                <!-- Website Name -->
                <span class="fw-bold">
                    Expense Tracker
                </span>

            </a>

        </div>

    </nav>


    <!-- ============================= -->
    <!-- Main Container -->
    <!-- ============================= -->

    <div class="container py-4">


        <!-- ============================= -->
        <!-- Summary Cards -->
        <!-- CSS Grid -->
        <!-- ============================= -->

        <div class="summary-grid">


            <!-- Total Amount -->

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h6 class="text-muted">

                        <i class="bi bi-cash-stack"></i>

                        Total Amount

                    </h6>


                    <h2
                        id="total-amount"
                        class="fw-bold"
                    >
                        0.00 JD
                    </h2>

                </div>

            </div>


            <!-- Number of Expenses -->

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h6 class="text-muted">

                        <i class="bi bi-receipt"></i>

                        Number of Expenses

                    </h6>


                    <h2
                        id="expense-count"
                        class="fw-bold"
                    >
                        0
                    </h2>

                </div>

            </div>


            <!-- Highest Expense -->

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h6 class="text-muted">

                        <i class="bi bi-graph-up"></i>

                        Highest Expense

                    </h6>


                    <h2
                        id="highest-expense"
                        class="fw-bold"
                    >
                        0.00 JD
                    </h2>

                </div>

            </div>

        </div>


        <!-- ============================= -->
        <!-- Add Expense Form -->
        <!-- ============================= -->

        <div class="card shadow-sm mb-4 mt-4">

            <div class="card-body">


                <h4 class="mb-3">
                    Add Expense
                </h4>


                <form id="expenseForm">


                    <div class="row g-3">


                        <!-- Title -->

                        <div class="col-md-6">

                            <label
                                for="title"
                                class="form-label"
                            >
                                Title
                            </label>


                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="Enter expense title"
                            >

                        </div>


                        <!-- Amount -->

                        <div class="col-md-6">

                            <label
                                for="amount"
                                class="form-label"
                            >
                                Amount
                            </label>


                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                placeholder="Enter amount"
                                step="0.01"
                            >

                        </div>


                        <!-- Category -->

                        <div class="col-md-6">

                            <label
                                for="category"
                                class="form-label"
                            >
                                Category
                            </label>


                            <select
                                id="category"
                                class="form-select"
                            >

                                <option value=
                                "">
                                    Choose category
                                </option>


                                <option value="Food">
                                    Food
                                </option>


                                <option value="Transport">
                                    Transport
                                </option>


                                <option value="Bills">
                                    Bills
                                </option>


                                <option value="Entertainment">
                                    Entertainment
                                </option>


                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Date -->

                        <div class="col-md-6">

                            <label
                                for="date"
                                class="form-label"
                            >
                                Date
                            </label>


                            <input
                                type="date"
                                id="date"
                                class="form-control"
                            >

                        </div>


                        <!-- Submit -->

                        <div class="col-12">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >

                                <i class="bi bi-plus-circle"></i>

                                Add Expense

                            </button>

                        </div>


                    </div>

                </form>

            </div>

        </div>


        <!-- ============================= -->
        <!-- Alert -->
        <!-- ============================= -->

        <div id="alertArea"></div>


        <!-- ============================= -->
        <!-- Spinner -->
        <!-- ============================= -->

        <div
            id="spinner"
            class="text-center my-4 d-none"
        >

            <div
                class="spinner-border"
                role="status"
            >

                <span class="visually-hidden">
                    Loading...
                </span>

            </div>

        </div>


        <!-- ============================= -->
        <!-- Expenses Header -->
        <!-- ============================= -->

        <div class="expenses-header mb-3">


            <h4 class="mb-0">
                Expenses
            </h4>


            <!-- Category Filter -->

            <select
                id="filterCategory"
                class="form-select"
            >

                <option value="All">
                    All
                </option>


                <option value="Food">
                    Food
                </option>


                <option value="Transport">
                    Transport
                </option>


                <option value="Bills">
                    Bills
                </option>


                <option value="Entertainment">
                    Entertainment
                </option>


                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- ============================= -->
        <!-- Expenses Table -->
        <!-- ============================= -->

        <div class="table-responsive">


            <table
                class="table table-bordered table-hover align-middle"
            >


                <thead class="table-dark">

                    <tr>

                        <th>
                            Title
                        </th>


                        <th>
                            Amount
                        </th>


                        <th>
                            Category
                        </th>


                        <th>
                            Date
                        </th>


                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="expensesTableBody">

                    <!-- JavaScript adds rows here -->

                </tbody>


            </table>

        </div>


    </div>


    <!-- ============================= -->
    <!-- Bootstrap JavaScript -->
    <!-- ============================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ============================= -->
    <!-- My JavaScript -->
    <!-- ============================= -->

    <script src="js/app.js"></script>


</body>

</html>
